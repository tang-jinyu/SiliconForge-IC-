services:
  agent:
    environment:
      DIGITAL_IC_AGENT_BASE_URL: http://vllm:8000/v1
      DIGITAL_IC_AGENT_MODEL: ${VLLM_MODEL:-Qwen/Qwen3-32B-AWQ}
      DIGITAL_IC_AGENT_API_KEY: ${VLLM_API_KEY:-local-h100}
      DIGITAL_IC_AGENT_LLM_TRANSPORT: chat
      # This shares only the local dual-H100 vLLM service, not a paid remote API quota.
      DIGITAL_IC_AGENT_ALLOW_SHARED_LLM: "true"
    depends_on:
      vllm:
        condition: service_healthy

  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    restart: unless-stopped
    ipc: host
    gpus: all
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - ${HF_CACHE_DIR:-./model-cache}:/root/.cache/huggingface
    command:
      - --model
      - ${VLLM_MODEL:-Qwen/Qwen3-32B-AWQ}
      - --tensor-parallel-size
      - ${VLLM_TENSOR_PARALLEL_SIZE:-2}
      - --api-key
      - ${VLLM_API_KEY:-local-h100}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-32768}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 10
